# Wheel + IMU odometry for the tracked VineBot (robot_localization ekf_node).
#   Tracks slip in turns: take only the FORWARD SPEED from the Roboteq wheel odometry and the TURN RATE from
#   the IMU. Output /odometry/filtered (frame odom) is the odometry input of localization/sketch_pf_node.
#   In the simulation this corresponds to run_regression.sh "loc_imu" (1% turn error): there it gave
#   0 contacts and 0% body overlap, while wheel-only odometry (8% turn error) overlapped up to 20 cm.
# Install: sudo apt install ros-humble-robot-localization
# IMU topic: /imu/data (BNO055 driver, or the D455 IMU through imu_filter_madgwick) - remap if different.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: false              # the Roboteq controller already publishes odom -> base_footprint (wheels)
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel_odom
    #             x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0_config: [false, false, false, false, false, false, true,  false, false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_queue_size: 5

    imu0: /imu/data
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
